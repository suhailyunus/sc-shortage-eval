name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify dependency lockfiles are up to date
        env:
          # GitHub's actions/setup-python `cache: pip` step restores a
          # cached ~/.cache/pip between runs, keyed off requirements*.txt
          # (which don't change often). That stale cache can make
          # pip-compile resolve against old index metadata instead of
          # PyPI's current state, causing this check to disagree with a
          # truly fresh resolution. Force both pip's HTTP cache and
          # pip-tools' own resolution cache to be bypassed so this check
          # always reflects reality, not a cached snapshot of it.
          PIP_NO_CACHE_DIR: "1"
        run: |
          # pip-tools 7.6.0 (latest) is incompatible with pip>=26 (it imports
          # a private pip internal that was removed). Pin pip down just for
          # this step so pip-compile actually runs.
          python -m pip install --quiet --no-cache-dir "pip<26"
          python -m pip install --quiet --no-cache-dir --upgrade pip-tools
          pip-compile requirements-api.txt --output-file requirements-api.lock.txt.check --resolver=backtracking --quiet --strip-extras --no-header --rebuild
          pip-compile requirements-frontend.txt --output-file requirements-frontend.lock.txt.check --resolver=backtracking --quiet --strip-extras --no-header --rebuild
          diff requirements-api.lock.txt requirements-api.lock.txt.check
          diff requirements-frontend.lock.txt requirements-frontend.lock.txt.check

      - name: Compile Python source
        run: python -m compileall -q api src frontend tests

      - name: Run API tests
        run: python -m pytest

  container-smoke-test:
    name: Build and smoke-test containers
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up --build --detach

      - name: Wait for API readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ready > /dev/null; then
              echo "API is ready."
              exit 0
            fi
            echo "Waiting for API (${attempt}/30)..."
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Verify Streamlit health
        run: |
          for attempt in {1..24}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8501/_stcore/health; then
              echo "Streamlit is healthy."
              exit 0
            fi

            echo "Waiting for Streamlit... attempt ${attempt}/24"
            sleep 5
          done

          echo "Streamlit did not become healthy in time."
          docker compose ps
          docker compose logs
          exit 1

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans
